name: Production smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - 'runtime-smoke/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe production
        shell: bash
        env:
          PRODUCTION_URL: https://edit-ia-phi.vercel.app/api/health
        run: |
          set +e
          code=$(curl -sS -L -o /tmp/health.json -w '%{http_code}' --max-time 30 "$PRODUCTION_URL")
          rc=$?
          if [ "$rc" -ne 0 ]; then
            code="CURL_${rc}"
            echo '{"error":"curl failed"}' > /tmp/health.json
          fi
          export HTTP_CODE="$code"
          python - <<'PY'
          import json, os
          raw=open('/tmp/health.json','rb').read().decode('utf-8','replace')
          try: body=json.loads(raw)
          except Exception: body={'raw':raw}
          out={'http':os.environ['HTTP_CODE'],'body':body}
          os.makedirs('runtime-smoke',exist_ok=True)
          with open('runtime-smoke/latest.json','w') as f: json.dump(out,f,indent=2,ensure_ascii=False)
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime-smoke/latest.json
          git diff --cached --quiet || git commit -m 'Record production smoke result'
          git push

# Production verification workflow: keep enabled after environment-variable redeploys.
