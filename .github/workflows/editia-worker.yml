name: EDIT-IA Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'runtime-smoke/**'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: editia-video-worker
  cancel-in-progress: true

env:
  EDITIA_R2_BUCKET: edit-ia-media

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
      STORAGE_BUCKET: edit-ia-media
      STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
      STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
      STORAGE_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout EDIT-IA
        uses: actions/checkout@v4
      - name: Install FFmpeg and system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r worker/requirements.txt
      - name: Validate EDIT-IA pipeline imports
        run: |
          python -m py_compile core/orchestrator/pipeline.py core/render/ffmpeg_renderer.py worker/github_actions_worker.py
          python - <<'PY'
          from core.orchestrator.pipeline import run
          from core.render.ffmpeg_renderer import render
          print('EDIT-IA pipeline imports: OK')
          print('EDIT-IA renderer imports: OK')
          PY
      - name: Run local render smoke test
        run: |
          set -e
          mkdir -p /tmp/editia-smoke
          ffmpeg -y -f lavfi -i "testsrc=size=320x180:rate=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/editia-smoke/reference.mp4 >/dev/null 2>&1
          ffmpeg -y -f lavfi -i "testsrc2=size=320x180:rate=30" -f lavfi -i "sine=frequency=660:sample_rate=48000" -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/editia-smoke/source.mp4 >/dev/null 2>&1
          python - <<'PY'
          from core.orchestrator.pipeline import run
          result = run('/tmp/editia-smoke/reference.mp4', '/tmp/editia-smoke/source.mp4', '/tmp/editia-smoke/output.mp4', max_iterations=1)
          assert result.get('output')
          print('EDIT-IA render smoke test: OK')
          print('QC:', result.get('qc'))
          PY
          test -s /tmp/editia-smoke/output.mp4
      - name: Verify R2 connection
        run: |
          python - <<'PY'
          import os,hashlib
          from urllib.parse import urlparse
          import boto3
          from botocore.config import Config
          def clean(name,default=''):
              v=os.environ.get(name,default).strip()
              if len(v)>=2 and v[0]==v[-1] and v[0] in ('"',"'"): v=v[1:-1].strip()
              return v
          endpoint=clean('STORAGE_ENDPOINT'); bucket=clean('STORAGE_BUCKET'); access=clean('STORAGE_ACCESS_KEY'); secret=clean('STORAGE_SECRET_KEY')
          missing=[k for k,v in {'STORAGE_ENDPOINT':endpoint,'STORAGE_BUCKET':bucket,'STORAGE_ACCESS_KEY':access,'STORAGE_SECRET_KEY':secret}.items() if not v]
          print('R2 endpoint configured:',bool(endpoint)); print('R2 bucket:',bucket); print('R2 bucket fingerprint:',hashlib.sha256(bucket.encode()).hexdigest() if bucket else 'missing'); print('R2 credentials configured:',bool(access) and bool(secret)); print('R2 access key length:',len(access)); print('R2 signing region: auto')
          if missing: raise RuntimeError('Missing GitHub Actions secret(s): '+', '.join(missing))
          if len(access)!=32: raise RuntimeError('STORAGE_ACCESS_KEY is invalid: Cloudflare R2 Access Key ID must be 32 characters.')
          if not endpoint.startswith(('https://','http://')): endpoint='https://'+endpoint
          host=(urlparse(endpoint).hostname or '').strip().lower().rstrip('.')
          if not host or not host.endswith('.r2.cloudflarestorage.com'): raise RuntimeError('STORAGE_ENDPOINT must use the Cloudflare R2 host ending in .r2.cloudflarestorage.com')
          endpoint='https://'+host
          s3=boto3.client('s3',endpoint_url=endpoint,aws_access_key_id=access,aws_secret_access_key=secret,region_name='auto',config=Config(signature_version='s3v4',s3={'addressing_style':'path'},connect_timeout=10,read_timeout=30,retries={'max_attempts':3}))
          response=s3.list_objects_v2(Bucket=bucket,Prefix='jobs/',MaxKeys=1)
          print('R2 connection: OK'); print('R2 queue objects visible:',len(response.get('Contents',[])))
          PY
      - name: Run end-to-end queue smoke test
        if: ${{ github.event_name != 'schedule' }}
        run: |
          set -e
          rm -rf /tmp/editia-e2e
          mkdir -p /tmp/editia-e2e
          ffmpeg -y -f lavfi -i "testsrc=size=320x180:rate=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/editia-e2e/reference.mp4 >/dev/null 2>&1
          ffmpeg -y -f lavfi -i "testsrc2=size=320x180:rate=30" -f lavfi -i "sine=frequency=660:sample_rate=48000" -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/editia-e2e/source.mp4 >/dev/null 2>&1
          python - <<'PY'
          import json, os, subprocess, uuid
          import boto3
          from botocore.config import Config
          from pathlib import Path
          bucket=os.environ['STORAGE_BUCKET']; endpoint=os.environ['STORAGE_ENDPOINT']; access=os.environ['STORAGE_ACCESS_KEY']; secret=os.environ['STORAGE_SECRET_KEY']
          client=boto3.client('s3',endpoint_url=endpoint,aws_access_key_id=access,aws_secret_access_key=secret,region_name='auto',config=Config(signature_version='s3v4',s3={'addressing_style':'path'}))
          smoke=uuid.uuid4().hex
          ref_key=f'uploads/smoke-{smoke}-reference.mp4'; src_key=f'uploads/smoke-{smoke}-source.mp4'; job_key=f'jobs/{smoke}.json'; out_key=f'outputs/{smoke}.mp4'
          job={'id':smoke,'status':'QUEUED','stage':'QUEUED','progress':3,'detail':'End-to-end smoke test','reference':ref_key,'source':src_key,'referenceSize':Path('/tmp/editia-e2e/reference.mp4').stat().st_size,'sourceSize':Path('/tmp/editia-e2e/source.mp4').stat().st_size,'createdAt':'2026-01-01T00:00:00+00:00','version':'5.2.11'}
          try:
              client.upload_file('/tmp/editia-e2e/reference.mp4',bucket,ref_key,ExtraArgs={'ContentType':'video/mp4'})
              client.upload_file('/tmp/editia-e2e/source.mp4',bucket,src_key,ExtraArgs={'ContentType':'video/mp4'})
              client.put_object(Bucket=bucket,Key=job_key,Body=json.dumps(job).encode(),ContentType='application/json',CacheControl='no-store')
              subprocess.run(['python','worker/github_actions_worker.py'],check=True)
              result=json.loads(client.get_object(Bucket=bucket,Key=job_key)['Body'].read().decode())
              if result.get('status')!='COMPLETED': raise RuntimeError(f'E2E smoke job did not complete: {result}')
              if not result.get('outputKey') or result.get('outputKey')!=out_key: raise RuntimeError(f'Unexpected output key: {result.get("outputKey")}')
              client.head_object(Bucket=bucket,Key=out_key)
              print('EDIT-IA end-to-end queue smoke test: OK')
              print('Smoke job:',smoke)
          finally:
              for key in (job_key,ref_key,src_key,out_key):
                  try: client.delete_object(Bucket=bucket,Key=key)
                  except Exception: pass
          PY
      - name: Process queued EDIT-IA jobs
        run: python worker/github_actions_worker.py
