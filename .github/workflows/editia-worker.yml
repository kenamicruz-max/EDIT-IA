name: EDIT-IA Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: editia-video-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
      STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
      STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
      STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
      STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout EDIT-IA
        uses: actions/checkout@v4

      - name: Install FFmpeg and system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r worker/requirements.txt

      - name: Verify R2 connection
        run: |
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlparse
          import boto3
          from botocore.config import Config

          def clean(name, default=''):
              value = os.environ.get(name, default).strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in ('"', "'"):
                  value = value[1:-1].strip()
              return value

          endpoint = clean('STORAGE_ENDPOINT')
          bucket = clean('STORAGE_BUCKET')
          region = clean('STORAGE_REGION', 'auto') or 'auto'
          access = clean('STORAGE_ACCESS_KEY')
          secret = clean('STORAGE_SECRET_KEY')
          required = {
              'STORAGE_ENDPOINT': endpoint,
              'STORAGE_BUCKET': bucket,
              'STORAGE_ACCESS_KEY': access,
              'STORAGE_SECRET_KEY': secret,
              'STORAGE_REGION': region,
          }
          missing = [k for k, v in required.items() if not v]
          print('R2 endpoint configured:', bool(endpoint))
          print('R2 bucket configured:', bool(bucket))
          print('R2 credentials configured:', bool(access) and bool(secret))
          print('R2 region configured:', region)
          if missing:
              raise RuntimeError('Missing GitHub Actions secret(s): ' + ', '.join(missing))
          if len(access) != 32:
              raise RuntimeError('STORAGE_ACCESS_KEY is invalid: Cloudflare R2 S3 Access Key ID must be 32 characters. Replace only this GitHub secret with the Access Key ID generated by the R2 API token.')
          if not endpoint.startswith(('https://', 'http://')):
              endpoint = 'https://' + endpoint
          parsed = urlparse(endpoint)
          hostname = (parsed.hostname or '').strip().lower().rstrip('.')
          if not hostname:
              raise RuntimeError('STORAGE_ENDPOINT is not a valid URL')
          if '<' in hostname or '>' in hostname:
              raise RuntimeError('STORAGE_ENDPOINT contains a placeholder; use the real Cloudflare R2 endpoint')
          if not hostname.endswith('.r2.cloudflarestorage.com'):
              match = re.search(r'([a-z0-9-]+\.r2\.cloudflarestorage\.com)', hostname)
              if match:
                  hostname = match.group(1)
              else:
                  raise RuntimeError('STORAGE_ENDPOINT must use the Cloudflare R2 host ending in .r2.cloudflarestorage.com')
          endpoint = f'https://{hostname}'
          print('R2 endpoint normalized: OK')

          s3 = boto3.client(
              's3',
              endpoint_url=endpoint,
              aws_access_key_id=access,
              aws_secret_access_key=secret,
              region_name=region,
              config=Config(
                  signature_version='s3v4',
                  s3={'addressing_style': 'path'},
                  connect_timeout=10,
                  read_timeout=30,
                  retries={'max_attempts': 3},
              ),
          )
          try:
              response = s3.list_objects_v2(Bucket=bucket, Prefix='jobs/', MaxKeys=1)
              print('R2 connection: OK')
              print('R2 queue objects visible:', len(response.get('Contents', [])))
          except Exception as exc:
              print('R2 connection failed:', type(exc).__name__, str(exc))
              raise
          PY

      - name: Process queued EDIT-IA jobs
        run: python worker/github_actions_worker.py
