name: EDIT-IA Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: editia-video-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
      STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
      STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
      STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
      STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout EDIT-IA
        uses: actions/checkout@v4

      - name: Install FFmpeg and system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r worker/requirements.txt

      - name: Verify R2 connection
        run: |
          python - <<'PY'
          import os
          import boto3
          endpoint = os.environ.get('STORAGE_ENDPOINT', '')
          bucket = os.environ.get('STORAGE_BUCKET', '')
          required = ['STORAGE_ENDPOINT','STORAGE_BUCKET','STORAGE_ACCESS_KEY','STORAGE_SECRET_KEY','STORAGE_REGION']
          missing = [k for k in required if not os.environ.get(k)]
          print('R2 endpoint configured:', bool(endpoint))
          print('R2 bucket configured:', bool(bucket))
          print('R2 credentials configured:', bool(os.environ.get('STORAGE_ACCESS_KEY')) and bool(os.environ.get('STORAGE_SECRET_KEY')))
          if missing:
              raise RuntimeError('Missing GitHub Actions secret(s): ' + ', '.join(missing))
          s3 = boto3.client('s3', endpoint_url=endpoint, aws_access_key_id=os.environ['STORAGE_ACCESS_KEY'], aws_secret_access_key=os.environ['STORAGE_SECRET_KEY'], region_name=os.environ.get('STORAGE_REGION') or 'auto')
          try:
              s3.head_bucket(Bucket=bucket)
          except Exception as exc:
              print('R2 connection failed:', type(exc).__name__, str(exc))
              raise
          print('R2 connection: OK')
          PY

      - name: Process queued EDIT-IA jobs
        run: python worker/github_actions_worker.py
